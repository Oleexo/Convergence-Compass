<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Fiche de classe · Convergence Compass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: back link, hero, "where to look" block (schematic map | progress + zone/type filters), sticky tools bar, equipment lists, prev/next. */
:root {
  --bg: #ECEEF1; --surface: #F7F8F9; --ink: #1A1D23; --muted: #566070; --line: #CBD0D8;
  --accent: #96560F; --accent-ink: #FFFFFF;
  --c-martial: #A8452F; --c-sorcery: #2D6AAE; --c-incant: #2A7A66; --c-special: #6A5C9E;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #181B21; --ink: #E5E7EB; --muted: #98A0AD; --line: #2B303A;
    --accent: #E2A94F; --accent-ink: #1A1305;
    --c-martial: #E27F63; --c-sorcery: #74ABE8; --c-incant: #5EC6AA; --c-special: #AC9EE3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #181B21; --ink: #E5E7EB; --muted: #98A0AD; --line: #2B303A;
  --accent: #E2A94F; --accent-ink: #1A1305;
  --c-martial: #E27F63; --c-sorcery: #74ABE8; --c-incant: #5EC6AA; --c-special: #AC9EE3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.back { font-size: 14px; font-weight: 600; text-decoration: none; align-self: flex-start; }
.back:hover { text-decoration: underline; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 2px; font-size: 14px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px); gap: 20px 32px; border-top: 4px solid var(--fam); padding-top: 18px; }
.hero-id { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tag { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--fam); }
.hero h1 { font-size: clamp(38px, 7vw, 64px); line-height: 1.02; }
.blurb { margin: 0; font-size: 17px; color: var(--muted); max-width: 60ch; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; font-size: 15px; margin: 6px 0 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.maps { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; align-self: start; }
.panel h2 { font-size: 20px; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.bar { display: grid; grid-template-columns: 30px 1fr 22px; align-items: center; gap: 6px; font-size: 12px; }
.bar .k { color: var(--muted); font-family: var(--font-mono); }
.bar .v { text-align: right; font-family: var(--font-mono); }
.track { height: 6px; background: var(--line); border-radius: 1px; position: relative; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--fam); }
.kit { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; margin: 0; }
.kit b { color: var(--ink); font-weight: 600; }

/* where to look */
.locate { display: block; }
.filt { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 2fr); gap: 14px 28px; align-self: auto; }
.filt > div:last-child { grid-column: 2; }
.prog-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.prog-top b { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.pbar { height: 8px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 6px 0 8px; }
.pbar i { display: block; height: 100%; background: var(--fam); width: 0; transition: width 0.2s; }
.opt { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 3px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip .n { opacity: 0.65; margin-left: 4px; font-size: 12px; }

/* tools */
.bar-sticky { position: sticky; top: 0; z-index: 10; background: var(--bg); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: 1180px; width: 100%; margin: 0 auto; }
.tools input[type="search"] { flex: 1; min-width: 180px; font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--surface); }
.seg[hidden] { display: none; }
.seg button { background: transparent; border: 0; padding: 5px 12px; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg .cnt { opacity: 0.65; margin-left: 6px; font-size: 12px; font-family: var(--font-mono); }

/* lists */
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; max-width: 90ch; margin: 0 0 8px; }
.grp { font-family: var(--font-body); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 22px 0 6px; }
.grp .mono { margin-left: 6px; opacity: 0.7; }
.its { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0 32px; }
.it { padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.it .nm { font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.it > .loc, .it > .pcs, .it > .sps { margin-left: 26px; }
.loc { font-size: 14px; color: var(--muted); margin: 0; overflow-wrap: anywhere; display: block; }
.loc b { color: var(--ink); font-weight: 600; }
.pcs { list-style: none; margin: 2px 0 0; padding: 0; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.pc { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.pc b { color: var(--ink); font-weight: 600; }
.ckb { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); align-self: center; flex: none; cursor: pointer; }
.ck0 { width: 17px; flex: none; }
.done > .nm .txt, .done .pc-t { text-decoration: line-through; }
.done { opacity: 0.55; }
.badge { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--fam); border: 1px solid color-mix(in srgb, var(--fam) 55%, transparent); border-radius: 99px; padding: 0 7px; white-space: nowrap; }
.rune { border-left: 3px solid var(--fam); padding: 6px 0 6px 12px; }
.runes { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px 32px; margin-top: 14px; }
.rh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.rh h3 { font-size: 21px; }
.rh .mono { font-size: 12px; color: var(--muted); }
.sps { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.sp { font-size: 13px; padding: 1px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }
.sp.hit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); font-weight: 600; }
a.wk { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
a.wk:hover { text-decoration-color: var(--accent); }
.zt, .ot { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; white-space: nowrap; vertical-align: 1px; margin-left: 6px; }
.zt[data-z="unk"] { border-style: dashed; }
.ot { border-color: transparent; background: color-mix(in srgb, var(--muted) 14%, transparent); }
.kd { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700; color: var(--muted); min-width: 66px; }
.ac { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 99px; padding: 0 7px; white-space: nowrap; vertical-align: 1px; margin-left: 6px; }
.pd { margin: 4px 0 0 26px; font-size: 14px; }
.pd summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; width: fit-content; }
.pd .warn { color: var(--accent); }
.pd-b { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin-top: 4px; }
.pd-b p { margin: 4px 0; color: var(--ink); }
.pd-b .alt { color: var(--muted); border-left: 3px solid var(--accent); padding-left: 8px; }
.pd-b .src { color: var(--muted); font-size: 12px; }
.pm { margin: 6px 0; }
.pm img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 3px; display: block; }
.pm figcaption { font-size: 12px; color: var(--muted); margin-top: 2px; }
.plc { font-family: var(--font-body); font-weight: 600; font-size: 16px; margin: 14px 0 2px; }
.plc .mono { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
.empty { padding: 24px 0; color: var(--muted); }
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.pager a { text-decoration: none; font-weight: 600; border: 1px solid var(--line); border-radius: 3px; padding: 8px 14px; background: var(--surface); }
.pager a:hover { border-color: var(--accent); }
footer { font-size: 13px; color: var(--muted); max-width: 90ch; }
@media (max-width: 900px) {
  .filt { grid-template-columns: 1fr; }
  .filt > div:last-child { grid-column: auto; }
}
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .bars { grid-template-columns: 1fr; }
  .its, .runes { grid-template-columns: 1fr; }
  .bar-sticky { position: static; }
}
</style>
</head>
<body>
<div class="wrap" id="page">
  <a class="back" id="back" href="index.html">← Toutes les classes</a>
  <div id="content"></div>
</div>

<script src="classes.js"></script>
<script src="det.js"></script>
<script src="zones.js"></script>
<script src="prec.js"></script>
<script src="fiche.js"></script>
<script>
(function () {
  var CV = window.CV, D = window.DET, Z = window.ZONES, F = window.FICHE;
  var STATS = CV.STATS, STAT_FR = CV.STAT_FR, FAM = CV.FAM, FAM_VAR = CV.FAM_VAR, C = CV.C, BY = CV.BY;
  var ZL = {}, ZO = {};
  Z.list.forEach(function (z, i) { ZL[z[0]] = z[1]; ZO[z[0]] = i; });
  var OBT_L = {}; F.OBT.forEach(function (o) { OBT_L[o[0]] = o[1]; });
  var REGION_PREFIX = ['Limgrave', 'Liurnia', 'Caelid', 'Weeping Peninsula', 'Altus Plateau', 'Mt. Gelmir', 'Mountaintops of the Giants', 'Consecrated Snowfield', 'Cerulean Coast', 'Scadu Altus', 'Hinterlands'];
  var FR_FIRST = ['Après', 'Butin', 'Donné', 'Vendu', 'Acheté', 'Sur', 'Au', 'Quête', 'Fin', 'Obtenue', 'Tableau', 'Coffre', 'Cimetière', 'Chambres', 'Cascade', 'Champ', 'Intérieur', 'Marchand', 'Près', 'Plateau', 'Camp', 'Tour', 'Golem', 'Fallingstar', 'Devant'];
  var LOWER_OK = ['of', 'the', 'to', 'and', 'in', 'at'];
  var MAP_URL = { mod: 'https://map.quack.boo/', wiki: 'https://wiki.convergencemod.com/' };
  var TAB_GROUPS = { armor: ['Set de départ', 'Sets à trouver'], wpn: ['Catalyseurs', 'Armes', 'Objet de classe'] };
  var S = { id: null, tab: 'armor', v: 'tab', z: 'all', t: 'all', q: '', hide: false, rs: false };
  var ENTS = [];
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function nSpells(d) { return (d.runes || []).reduce(function (n, r) { return n + r[0].split('; ').length; }, 0); }
  function wiki(name) { return 'https://eldenring.wiki.fextralife.com/' + encodeURIComponent(name).replace(/%20/g, '+'); }
  /* Nom anglais propre (pas de texte français) → lien wiki, sinon null. */
  function cleanName(s) {
    var i = s.indexOf(', ');
    if (i > -1 && REGION_PREFIX.indexOf(s.slice(0, i)) > -1) s = s.slice(i + 2);
    if (s.indexOf(', ') > -1 || /[«»(]/.test(s)) return null;
    var w = s.split(' ');
    if (FR_FIRST.indexOf(w[0]) > -1) return null;
    for (var k = 0; k < w.length; k++) {
      if (LOWER_OK.indexOf(w[k]) > -1) continue;
      var c = w[k].charAt(0);
      if (c === c.toLowerCase() && c !== c.toUpperCase()) return null;
    }
    return s;
  }
  function link(label, name) {
    var n = name && cleanName(name);
    return n ? '<a class="wk" href="' + wiki(n) + '" target="_blank" rel="noopener" title="Page du wiki Fextralife">' + esc(label) + '</a>' : esc(label);
  }
  var WIKI = 'https://wiki.convergencemod.com/wiki/';
  function nameLink(e, label) {
    label = label == null ? e.name : label;
    if (e.nolink || e.kind === 'Sorts') return esc(label);
    if (e.prec && e.prec.page) return '<a class="wk" href="' + WIKI + e.prec.page + '" target="_blank" rel="noopener" title="Page du wiki Convergence">' + esc(label) + '</a>';
    return link(label, e.name);
  }
  function pdet(e) {
    var p = e.prec;
    if (!p) return '';
    var h = '<details class="pd"><summary>Précisions' + (p.alt ? ' <span class="warn" title="Sources divergentes">⚠</span>' : '') + '</summary><div class="pd-b"><p>' + esc(p.note) + '</p>';
    if (p.alt) h += '<p class="alt">⚠ ' + esc(p.alt) + '</p>';
    (p.maps || []).forEach(function (f) {
      h += '<figure class="pm"><img loading="lazy" src="' + WIKI + 'Special:FilePath/' + f + '" alt="Carte : ' + esc(e.name) + '" data-f="' + esc(f) + '"><figcaption>Image du wiki du mod</figcaption></figure>';
    });
    return h + '<p class="src">Source : <a class="wk" href="' + WIKI + p.page + '" target="_blank" rel="noopener">wiki du mod</a>. La grâce la plus proche n\'est pas indiquée par cette source.</p></div></details>';
  }
  function acc(e) { return e.prec && e.prec.acc ? e.prec.acc.map(function (a) { return '<span class="ac">' + esc(a) + '</span>'; }).join('') : ''; }
  function tags(e) {
    return acc(e) + '<span class="zt" data-z="' + e.zone + '">' + esc(ZL[e.zone]) + '</span>' + (e.obt !== 'start' ? '<span class="ot" title="' + esc(OBT_L[e.obt]) + '">' + esc(F.OBT_SHORT[e.obt]) + '</span>' : '');
  }
  function done(e) { return e.check && F.isDone(S.id, e); }
  function ck(e) {
    return e.check ? '<input type="checkbox" class="ckb" data-k="' + esc(e.key) + '"' + (done(e) ? ' checked' : '') + ' aria-label="Récupéré : ' + esc(e.name + (e.label ? ' (' + e.label + ')' : '')) + '">' : '<span class="ck0"></span>';
  }
  function textOf(e) { return [e.name, e.label || '', e.detail, e.how || '', e.kind, (e.spells || []).join(' '), ZL[e.zone], OBT_L[e.obt], e.prec ? e.prec.note + ' ' + (e.prec.place || '') + ' ' + (e.prec.acc || []).join(' ') : ''].join(' ').toLowerCase(); }
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return ENTS.filter(function (e) {
      return (S.z === 'all' || e.zone === S.z) && (S.t === 'all' || e.obt === S.t) && (!S.hide || !done(e)) && (!q || textOf(e).indexOf(q) > -1);
    });
  }
  function none() { return '<p class="empty">Rien ne correspond à ces filtres.</p>'; }

  /* ----- vue par rubrique ----- */
  function pieceHtml(e) {
    return '<li class="pc' + (done(e) ? ' done' : '') + '">' + ck(e) + '<span class="pc-t">' + (e.label ? '<b>' + esc(e.label) + '</b> ' : '') + link(e.detail, e.detail) + '</span>' + tags(e) + pdet(e) + '</li>';
  }
  function rowHtml(r) {
    var first = r.items[0], single = r.items.length === 1 && !first.label;
    var nameHtml = '<span class="txt">' + nameLink(first, r.name) + '</span>' + (first.badge ? '<span class="badge">' + esc(first.badge) + '</span>' : '');
    if (single) {
      return '<li class="it' + (done(first) ? ' done' : '') + '"><div class="nm">' + ck(first) + nameHtml + '</div><span class="loc">' +
        (first.nolink ? esc(first.detail) : link(first.detail, first.detail)) + tags(first) + '</span>' + pdet(first) + '</li>';
    }
    return '<li class="it"><div class="nm"><span class="ck0"></span>' + nameHtml + '</div><ul class="pcs">' + r.items.map(pieceHtml).join('') + '</ul></li>';
  }
  function viewTab(list) {
    var d = D[S.id], out = '';
    if (S.tab === 'spells') return viewSpells(list.filter(function (e) { return e.tab === 'spells'; }), d);
    if (S.tab === 'armor' && d.note) out += '<p class="note">' + esc(d.note) + '</p>';
    if (S.tab === 'wpn' && d.wnote) out += '<p class="note">' + esc(d.wnote) + '</p>';
    var es = list.filter(function (e) { return e.tab === S.tab; }), any = false;
    TAB_GROUPS[S.tab].forEach(function (g) {
      var ge = es.filter(function (e) { return e.group === g; });
      if (!ge.length) return;
      any = true;
      var rows = [];
      ge.forEach(function (e) {
        var last = rows[rows.length - 1];
        if (last && last.name === e.name) last.items.push(e); else rows.push({ name: e.name, items: [e] });
      });
      out += '<h2 class="grp">' + g + '<span class="mono">' + ge.length + '</span></h2><ul class="its">' + rows.map(rowHtml).join('') + '</ul>';
    });
    return out + (any ? '' : (d.wnote && S.tab === 'wpn' ? '' : none()));
  }
  function runeHtml(e, q) {
    var hit = function (s) { return !!q && s.toLowerCase().indexOf(q) > -1; };
    return '<section class="rune' + (done(e) ? ' done' : '') + '"><div class="rh">' + ck(e) + '<h3 class="txt">' + esc(e.name.replace('Palier ', '')) + '</h3>' + (e.tier === 5 ? '<span class="badge">Extension</span>' : '') + '<span class="mono">' + e.spells.length + ' sorts</span></div><div class="sps">' +
      e.spells.map(function (s) { return '<span class="sp' + (hit(s) ? ' hit' : '') + '">' + esc(s) + '</span>'; }).join('') +
      '</div><p class="loc"><b>' + link(e.detail, e.detail) + '</b>' + (e.how ? ' · ' + esc(e.how) : '') + tags(e) + '</p>' + pdet(e) + '</section>';
  }
  function viewSpells(es, d) {
    var q = S.q.trim().toLowerCase();
    var out = '<p class="note">Les runes de sorts de cette classe (' + esc(d.rune) + ') sont des consommables à usage unique : chaque palier débloque la liste de sorts indiquée.' +
      (d.runes.length > 5 ? ' Le palier Shadow se trouve dans les zones de l\'extension Shadow of the Erdtree.' : '') + '</p>';
    return out + (es.length ? '<div class="runes">' + es.map(function (e) { return runeHtml(e, q); }).join('') + '</div>' : none());
  }

  /* ----- vue par région ----- */
  function flatItem(e) {
    var nm = '<span class="kd">' + e.kind + '</span><span class="txt">' + nameLink(e) + '</span>' + (e.badge ? '<span class="badge">' + esc(e.badge) + '</span>' : '');
    var sub = e.kind === 'Sorts'
      ? '<div class="sps">' + e.spells.map(function (s) { return '<span class="sp">' + esc(s) + '</span>'; }).join('') + '</div><span class="loc"><b>' + link(e.detail, e.detail) + '</b>' + (e.how ? ' · ' + esc(e.how) : '') + tags(e) + '</span>'
      : '<span class="loc">' + (e.label ? '<b>' + esc(e.label) + '</b> ' : '') + (e.nolink ? esc(e.detail) : link(e.detail, e.detail)) + tags(e) + '</span>';
    return '<li class="it' + (done(e) ? ' done' : '') + '"><div class="nm">' + ck(e) + nm + '</div>' + sub + pdet(e) + '</li>';
  }
  function byZone(list) {
    var by = {};
    list.forEach(function (e) { (by[e.zone] = by[e.zone] || []).push(e); });
    return Object.keys(by).sort(function (a, b) { return ZO[a] - ZO[b]; }).map(function (z) { return [z, by[z]]; });
  }
  function viewZones(list) {
    if (!list.length) return none();
    return byZone(list).map(function (g) {
      return '<h2 class="grp">' + esc(ZL[g[0]]) + '<span class="mono">' + g[1].length + '</span></h2><ul class="its">' + g[1].map(flatItem).join('') + '</ul>';
    }).join('');
  }
  /* Itinéraire : par région puis par lieu précis, pour tout récupérer en un passage. */
  function placeOf(e) {
    if (e.prec && e.prec.place) return e.prec.place;
    if (e.obt === 'start' && e.kind !== 'Sorts') return 'Équipement de départ';
    if (e.kind === 'Sorts') return e.detail.replace(/^[^,]+,\s*/, '');
    return e.detail;
  }
  function viewPlaces(list) {
    if (!list.length) return none();
    return byZone(list).map(function (g) {
      var pl = {}, order = [];
      g[1].forEach(function (e) { var k = placeOf(e); if (!pl[k]) { pl[k] = []; order.push(k); } pl[k].push(e); });
      order.sort(function (a, b) { return pl[b].length - pl[a].length; });
      return '<h2 class="grp">' + esc(ZL[g[0]]) + '<span class="mono">' + g[1].length + '</span></h2>' + order.map(function (k) {
        return '<h3 class="plc">' + esc(k) + (pl[k].length > 1 ? '<span class="mono">' + pl[k].length + ' objets</span>' : '') + '</h3><ul class="its">' + pl[k].map(flatItem).join('') + '</ul>';
      }).join('');
    }).join('');
  }

  function renderBody() {
    var list = filtered();
    $('list').innerHTML = S.v === 'zone' ? viewZones(list) : S.v === 'place' ? viewPlaces(list) : viewTab(list);
  }

  /* ----- carte schématique ----- */
  function stats() {
    var st = {};
    ENTS.forEach(function (e) {
      var s = st[e.zone] = st[e.zone] || { n: 0, tot: 0, dn: 0, start: false };
      s.n++;
      if (e.check) { s.tot++; if (done(e)) s.dn++; }
      if (e.obt === 'start') s.start = true;
    });
    return st;
  }
  /* ----- panneau de filtres et progression ----- */
  function renderSide() {
    var st = stats(), tot = 0, dn = 0, tc = {};
    Object.keys(st).forEach(function (z) { tot += st[z].tot; dn += st[z].dn; });
    ENTS.forEach(function (e) { tc[e.obt] = (tc[e.obt] || 0) + 1; });
    $('p-txt').textContent = dn + ' / ' + tot + ' récupérés';
    $('p-bar').style.width = (tot ? dn / tot * 100 : 0) + '%';
    $('p-reset').textContent = S.rs ? 'Confirmer la remise à zéro' : 'Remettre à zéro';
    $('hide').checked = S.hide;
    var zs = Object.keys(st).sort(function (a, b) { return ZO[a] - ZO[b]; });
    $('zones').innerHTML = [['all', 'Toutes', ENTS.length]].concat(zs.map(function (z) { return [z, ZL[z], st[z].tot ? st[z].dn + '/' + st[z].tot : '·']; })).map(function (z) {
      return '<button class="chip" data-act="zone" data-z="' + z[0] + '" aria-pressed="' + (S.z === z[0]) + '">' + esc(z[1]) + '<span class="n mono">' + z[2] + '</span></button>';
    }).join('');
    $('types').innerHTML = [['all', 'Tous', ENTS.length]].concat(F.OBT.filter(function (o) { return tc[o[0]]; }).map(function (o) { return [o[0], o[1], tc[o[0]]]; })).map(function (o) {
      return '<button class="chip" data-act="type" data-o="' + o[0] + '" aria-pressed="' + (S.t === o[0]) + '">' + esc(o[1]) + '<span class="n mono">' + o[2] + '</span></button>';
    }).join('');
  }
  function renderTools() {
    var d = D[S.id];
    $('view').innerHTML = [['tab', 'Par rubrique'], ['zone', 'Par région'], ['place', 'Itinéraire']].map(function (v) {
      return '<button data-act="view" data-v="' + v[0] + '" aria-pressed="' + (S.v === v[0]) + '">' + v[1] + '</button>';
    }).join('');
    $('tabs').hidden = S.v !== 'tab';
    var names = function (tab) { var s = {}; ENTS.forEach(function (e) { if (e.tab === tab) s[e.name] = 1; }); return Object.keys(s).length; };
    var t = [['armor', 'Armures', names('armor')], ['wpn', 'Armes', names('wpn')]];
    if (d.runes) t.push(['spells', 'Sorts', nSpells(d)]);
    $('tabs').innerHTML = t.map(function (x) {
      return '<button data-act="tab" data-t="' + x[0] + '" aria-pressed="' + (S.tab === x[0]) + '">' + x[1] + '<span class="cnt">' + x[2] + '</span></button>';
    }).join('');
  }

  function bars(x) {
    return '<div class="bars">' + STATS.map(function (k, i) {
      var v = x.s[i];
      return '<div class="bar" title="' + STAT_FR[k] + ' ' + v + '"><span class="k">' + k + '</span><span class="track"><i style="width:' + Math.min(100, v / 18 * 100) + '%"></i></span><span class="v">' + v + '</span></div>';
    }).join('') + '</div>';
  }
  function renderPage() {
    var x = BY[S.id], d = D[S.id];
    ENTS = F.entries(S.id);
    var famVar = 'var(' + FAM_VAR[x.fam] + ')';
    var dlc = ENTS.some(function (e) { return e.zone === 'dlc'; });
    var facts = '<dt>Départ</dt><dd>' + esc(x.region) + ', ' + esc(x.place) + '</dd><dt>Niveau</dt><dd class="mono">' + x.lvl + '</dd><dt>Stats clés</dt><dd class="mono">' + esc(x.prim) + '</dd>';
    if (x.dmg) facts += '<dt>Dégâts</dt><dd>' + esc(x.dmg) + (x.theme ? ' · ' + esc(x.theme) : '') + '</dd>';
    else if (x.theme) facts += '<dt>Thème</dt><dd>' + esc(x.theme) + '</dd>';
    if (x.armor) facts += '<dt>Armure</dt><dd>' + esc(x.armor) + '</dd>';
    var i = x.order, prev = C[(i + C.length - 1) % C.length], next = C[(i + 1) % C.length];
    $('content').innerHTML =
      '<div style="--fam:' + famVar + ';display:flex;flex-direction:column;gap:24px">' +
      '<header class="hero"><div class="hero-id"><span class="tag">' + esc(FAM[x.fam]) + '</span><h1>' + esc(x.name) + '</h1><p class="blurb">' + esc(x.blurb) + '</p><dl class="facts">' + facts + '</dl>' +
      '<p class="maps"><a class="wk" href="' + MAP_URL.mod + '" target="_blank" rel="noopener">Carte interactive du mod ↗</a><a class="wk" href="' + MAP_URL.wiki + '" target="_blank" rel="noopener">Wiki du mod ↗</a></p></div>' +
      '<aside class="panel"><h2>Départ</h2>' + bars(x) + '<p class="kit"><span><b>Matériel</b> ' + x.kit.map(esc).join(' · ') + '</span><span><b>Set</b> ' + esc(d.set) + '</span>' + (x.spells ? '<span><b>Sorts</b> ' + x.spells.map(esc).join(' · ') + '</span>' : '') + '</p></aside></header>' +
      '<section class="locate" aria-label="Où chercher">' +
      '<div class="panel filt"><div><div class="prog-top"><b id="p-txt"></b><button class="link" id="p-reset"></button></div><div class="pbar"><i id="p-bar"></i></div>' +
      '<label class="opt"><input type="checkbox" id="hide" class="ckb"> Masquer ce que j\'ai déjà récupéré</label></div>' +
      '<div><span class="eyebrow">Zones</span><div class="chips" id="zones" role="group" aria-label="Filtrer par zone"></div></div>' +
      '<div><span class="eyebrow">Type d\'obtention</span><div class="chips" id="types" role="group" aria-label="Filtrer par type d\'obtention"></div></div></div></section>' +
      '<div class="bar-sticky"><div class="tools"><div class="seg" id="view" role="group" aria-label="Organisation de la liste"></div><div class="seg" id="tabs" role="group" aria-label="Rubriques"></div>' +
      '<input id="q" type="search" placeholder="Filtrer par nom ou lieu" aria-label="Filtrer par nom ou lieu"></div></div>' +
      '<main id="list"></main>' +
      '<nav class="pager" aria-label="Autres classes"><a href="classe.html#' + prev.id + '" data-nav="' + prev.id + '">← ' + esc(prev.name) + '</a><a href="classe.html#' + next.id + '" data-nav="' + next.id + '">' + esc(next.name) + ' →</a></nav>' +
      '<footer>Sources : fiches de classes et pages de runes de <a href="https://www.convergencemod.com/classes/" target="_blank" rel="noopener">convergencemod.com</a> (19 octobre 2026) ; onglets « Précisions » : <a href="https://wiki.convergencemod.com/" target="_blank" rel="noopener">wiki du mod</a> (20 octobre 2026), disponibles pour l\'instant sur Glint Sorcerer. Ces sources se contredisent parfois : le cas est alors signalé par ⚠. Aucune ne donne la grâce la plus proche. Les conditions d\'obtention sont traduites, les noms d\'objets et de lieux restent en anglais. Les zones et les types d\'obtention sont déduits (zones recoupées sur le wiki quand c\'était possible, « à préciser » signale un doute). Les cases cochées sont enregistrées dans ton navigateur uniquement. Les armes listées sont celles de la fiche de la classe, pas un guide de build. Les noms d\'objets sans précision renvoient vers le wiki Fextralife (jeu de base) ; la carte interactive du mod n\'a pas pu être testée depuis ici.</footer></div>';
    $('q').value = S.q;
    $('q').addEventListener('input', function (e) { S.q = e.target.value; renderBody(); });
    renderSide();
    renderTools();
    renderBody();
    document.title = x.name + ' · Convergence Compass';
  }

  function route() {
    var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (!BY[id] || !D[id]) {
      $('content').innerHTML = '<p class="empty">Classe introuvable. <a href="index.html">Retour à la liste des classes</a>.</p>';
      document.title = 'Classe introuvable · Convergence Compass';
      return;
    }
    S = { id: id, tab: 'armor', v: 'tab', z: 'all', t: 'all', q: '', hide: false, rs: false };
    renderPage();
    window.scrollTo(0, 0);
  }
  function refresh() { renderSide(); renderTools(); renderBody(); }

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (nav) { e.preventDefault(); location.replace('classe.html#' + nav.dataset.nav); return; }
    var back = e.target.closest('#back');
    if (back && history.length > 1 && document.referrer) { e.preventDefault(); history.back(); return; }
    if (e.target.closest('#p-reset')) {
      if (S.rs) { F.reset(S.id); S.rs = false; refresh(); }
      else { S.rs = true; renderSide(); setTimeout(function () { if (S.rs) { S.rs = false; renderSide(); } }, 4000); }
      return;
    }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var a = el.dataset.act;
    if (a === 'view') S.v = el.dataset.v;
    else if (a === 'tab') S.tab = el.dataset.t;
    else if (a === 'zone') S.z = el.dataset.z;
    else if (a === 'type') S.t = el.dataset.o;
    else return;
    refresh();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'hide') { S.hide = t.checked; renderBody(); return; }
    if (t.classList && t.classList.contains('ckb') && t.dataset.k) {
      var ent = ENTS.filter(function (x) { return x.key === t.dataset.k; })[0];
      if (!ent) return;
      F.setDone(S.id, ent, t.checked);
      var row = t.closest('.pc, .it, .rune');
      if (row) row.classList.toggle('done', t.checked);
      if (S.hide) renderBody();
      renderSide();
    }
  });
  document.addEventListener('error', function (e) {
    var im = e.target;
    if (!im || im.tagName !== 'IMG' || !im.dataset.f) return;
    var fig = im.closest('figure');
    if (fig) fig.innerHTML = '<a class="wk" href="' + WIKI + 'File:' + esc(im.dataset.f) + '" target="_blank" rel="noopener">Ouvrir l\'image sur le wiki du mod ↗</a>';
  }, true);
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
